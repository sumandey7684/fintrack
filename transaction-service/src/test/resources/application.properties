spring.datasource.url=jdbc:h2:mem:transaction_service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS transaction_service
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=transaction_service
spring.jpa.open-in-view=false

fintrack.account-service.base-url=http://localhost:8081
