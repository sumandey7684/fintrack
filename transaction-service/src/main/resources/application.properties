server.port=8082

spring.application.name=transaction-service

spring.datasource.url=jdbc:postgresql://localhost:5433/fintrack
spring.datasource.username=fintrack
spring.datasource.password=fintrack
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=transaction_service
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jackson.serialization.write-dates-as-timestamps=false

# Overridable via FINTRACK_ACCOUNT_SERVICE_BASE_URL or -Dfintrack.account-service.base-url
fintrack.account-service.base-url=${FINTRACK_ACCOUNT_SERVICE_BASE_URL:http://localhost:8081}
